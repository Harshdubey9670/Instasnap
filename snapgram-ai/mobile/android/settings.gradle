          "packageImportPath": "import com.reactcommunity.rndatetimepicker.RNDateTimePickerPackage;",
          "packageInstance": "new RNDateTimePickerPackage()",
          "buildTypes": []
        }
      }
    },
    "expo": {
      "root": "${rootDir.parentFile.absolutePath}/node_modules/expo",
      "name": "expo",
      "platforms": {
        "android": {
          "sourceDir": "${rootDir.parentFile.absolutePath}/node_modules/expo/android",
          "packageImportPath": "import expo.modules.ExpoModulesPackage;",
          "packageInstance": "new ExpoModulesPackage()",
          "buildTypes": []
        }
      }
    },
    "react-native-safe-area-context": {
      "root": "${rootDir.parentFile.absolutePath}/node_modules/react-native-safe-area-context",
      "name": "react-native-safe-area-context",
      "platforms": {
        "android": {
