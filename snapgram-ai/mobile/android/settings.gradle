          "packageImportPath": "import com.swmansion.rnscreens.RNScreensPackage;",
          "packageInstance": "new RNScreensPackage()",
          "buildTypes": []
        }
      }
    },
    "react-native-svg": {
      "root": "${rootDir.parentFile.absolutePath}/node_modules/react-native-svg",
      "name": "react-native-svg",
      "platforms": {
        "android": {
          "sourceDir": "${rootDir.parentFile.absolutePath}/node_modules/react-native-svg/android",
