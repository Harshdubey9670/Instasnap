      "mainActivity": ".MainActivity"
    }
  },
  "dependencies": {
    "@react-native-async-storage/async-storage": {
      "root": "${rootDir.parentFile.absolutePath}/node_modules/@react-native-async-storage/async-storage",
      "name": "@react-native-async-storage/async-storage",
      "platforms": {
        "android": {
          "sourceDir": "${rootDir.parentFile.absolutePath}/node_modules/@react-native-async-storage/async-storage/android",
          "packageImportPath": "import com.reactnativecommunity.asyncstorage.AsyncStoragePackage;",
          "packageInstance": "new AsyncStoragePackage()",
          "buildTypes": []
        }
      }
    },
    "@react-native-community/datetimepicker": {
