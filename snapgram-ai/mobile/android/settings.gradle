      "name": "react-native-webview",
      "platforms": {
        "android": {
          "sourceDir": "${rootDir.parentFile.absolutePath}/node_modules/react-native-webview/android",
          "packageImportPath": "import com.reactnativecommunity.webview.RNCWebViewPackage;",
