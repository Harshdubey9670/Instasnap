dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

include ':app'

def modulesToInclude = [
  ':react-native-async-storage_async-storage': "${rootDir.parentFile.absolutePath}/node_modules/@react-native-async-storage/async-storage/android",
  ':react-native-community_datetimepicker': "${rootDir.parentFile.absolutePath}/node_modules/@react-native-community/datetimepicker/android",
  ':react-native-safe-area-context': "${rootDir.parentFile.absolutePath}/node_modules/react-native-safe-area-context/android",
  ':react-native-screens': "${rootDir.parentFile.absolutePath}/node_modules/react-native-screens/android",
  ':react-native-svg': "${rootDir.parentFile.absolutePath}/node_modules/react-native-svg/android",
  ':react-native-webrtc': "${rootDir.parentFile.absolutePath}/node_modules/react-native-webrtc/android",
  ':react-native-webview': "${rootDir.parentFile.absolutePath}/node_modules/react-native-webview/android"
]

modulesToInclude.each { path, projectDir ->
  include(path)
  project(path).projectDir = new File(projectDir)
}

includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())



