version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/snapgram
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_super_secret_jwt_key_snapgram_2026
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo:6-alpine
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
